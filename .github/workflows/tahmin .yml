name: Gunluk tahmin

on:
  schedule:
    # Saatler UTC: 04:37 ve 13:37 = İstanbul 07:37 ve 16:37
    - cron: "37 4,13 * * *"
  workflow_dispatch: # Actions sekmesinden elle çalıştırmak için

permissions:
  contents: write

jobs:
  tahmin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Kutuphaneleri kur
        run: pip install -r requirements.txt

      - name: Sportmonks verisini guncelle
        continue-on-error: true  # deneme biterse ya da hata olursa model eski verilerle devam eder
        env:
          SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
        run: python sportmonks.py

      - name: Oyuncu verisini guncelle
        continue-on-error: true  # deneme biterse eldeki kadro/ilk 11 dosyalari kullanilir
        timeout-minutes: 60
        env:
          SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
        run: python oyuncular.py

      - name: Avrupa kupasi maclarini guncelle
        continue-on-error: true  # kaynak yanit vermezse model dinlenme verisi olmadan devam eder
        env:
          SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
          FOOTBALL_DATA_ORG_KEY: ${{ secrets.FOOTBALL_DATA_ORG_KEY }}
        run: python yorgunluk.py

      - name: Tahminleri uret
        env:
          FOOTBALL_DATA_ORG_KEY: ${{ secrets.FOOTBALL_DATA_ORG_KEY }}
        run: python predict.py --fikstur --json tahminler.json

      - name: Karneyi guncelle
        run: python karne.py

      - name: Depoya kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tahminler.json karne.json arsiv/
          if [ -d data_sm ]; then git add data_sm/; fi
          if [ -d data_euro ]; then git add data_euro/; fi
          if [ -d data_players ]; then git add data_players/; fi
          if [ -f kadrolar.json ]; then git add kadrolar.json; fi
          if [ -f bitenler.json ]; then git add bitenler.json; fi
          git diff --staged --quiet || git commit -m "Tahminler guncellendi"
          git pull --rebase
          git push
