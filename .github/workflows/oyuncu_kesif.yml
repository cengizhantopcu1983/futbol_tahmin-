name: Oyuncu verisi kesif

on:
  workflow_dispatch: # Actions sekmesinden elle çalıştırılır

permissions:
  contents: write

jobs:
  kesif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Oyuncu verisini kontrol et
        env:
          SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
        run: |
          python oyuncu_kesif.py | tee oyuncu_kesif.txt
          {
            echo '## Oyuncu verisi kesif'
            echo '```'
            cat oyuncu_kesif.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Sonucu depoya kaydet
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add oyuncu_kesif.txt || true
          git diff --staged --quiet || git commit -m "Oyuncu kesif sonucu"
          git pull --rebase
          git push
