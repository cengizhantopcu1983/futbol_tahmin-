name: Gunluk tahmin

on:
  schedule:
    # Saatler UTC: 04:37 ve 13:37 = İstanbul 07:37 ve 16:37
    - cron: "37 4,13 * * *"
  workflow_dispatch: # Actions sekmesinden elle çalıştırmak için

permissions:
  contents: write

jobs:
  tahmin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Kutuphaneleri kur
        run: pip install -r requirements.txt

      - name: Tahminleri uret
        env:
          FOOTBALL_DATA_ORG_KEY: ${{ secrets.FOOTBALL_DATA_ORG_KEY }}
        run: python predict.py --fikstur --json tahminler.json

      - name: Depoya kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tahminler.json
          git diff --staged --quiet || git commit -m "Tahminler guncellendi"
          git pull --rebase
          git push
