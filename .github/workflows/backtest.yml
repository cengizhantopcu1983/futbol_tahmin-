name: Model testi

on:
  workflow_dispatch: # Actions sekmesinden elle çalıştırılır
    inputs:
      sezon:
        description: "Test sezonu (ör. 2526 = 2025-26)"
        required: true
        default: "2526"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Kutuphaneleri kur
        run: pip install -r requirements.txt

      - name: Geriye donuk test
        run: |
          python backtest.py --hepsi --sezon ${{ inputs.sezon }} | tee backtest_sonuc.txt
          {
            echo '## Model testi: sezon ${{ inputs.sezon }}'
            echo '```'
            cat backtest_sonuc.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Sonucu depoya kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtest_sonuc.txt
          git diff --staged --quiet || git commit -m "Model testi sonucu (${{ inputs.sezon }})"
          git pull --rebase
          git push
