name: Sportmonks kesif

on:
  workflow_dispatch: # Actions sekmesinden elle çalıştırılır

permissions:
  contents: write

jobs:
  kesif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sportmonks verisini kontrol et
        env:
          SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
        run: |
          python sportmonks_kesif.py | tee sportmonks_kesif.txt
          {
            echo '## Sportmonks kesif'
            echo '```'
            cat sportmonks_kesif.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Sonucu depoya kaydet
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sportmonks_kesif.txt || true
          git diff --staged --quiet || git commit -m "Sportmonks kesif sonucu"
          git pull --rebase
          git push
