name: Ayar optimizasyonu

on:
  workflow_dispatch: # Actions sekmesinden elle çalıştırılır

permissions:
  contents: write

jobs:
  ayar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Kutuphaneleri kur
        run: pip install -r requirements.txt

      - name: Sportmonks verisini guncelle
        continue-on-error: true  # deneme biterse ya da hata olursa model eski verilerle devam eder
        env:
          SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
        run: python sportmonks.py

      - name: Avrupa kupasi maclarini guncelle
        continue-on-error: true  # kaynak yanit vermezse model dinlenme verisi olmadan devam eder
        env:
          SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
          FOOTBALL_DATA_ORG_KEY: ${{ secrets.FOOTBALL_DATA_ORG_KEY }}
        run: python yorgunluk.py

      - name: Ayarlari ara
        run: |
          python tune.py --hepsi | tee ayar_sonuc.txt
          {
            echo '## Ayar optimizasyonu'
            echo '```'
            cat ayar_sonuc.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Depoya kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ayarlar.json ayar_sonuc.txt
          if [ -d data_sm ]; then git add data_sm/; fi
          if [ -d data_euro ]; then git add data_euro/; fi
          git diff --staged --quiet || git commit -m "Model ayarlari guncellendi"
          git pull --rebase
          git push
